name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint + typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (workspace packages — types needed for typecheck/test)
        run: pnpm build

      - name: Lint (typecheck)
        run: pnpm lint

      - name: Test
        run: pnpm test

      # ADR-140: the shipped Pack catalog must stay free of cross-pack conflicts
      # (REWRITE-field overlap, DEFER-signal collision, taint contradiction,
      # duplicate intents). Offline/CI only — never runs inside adjudicate().
      # Adopters wire this same command over THEIR declared merge set.
      - name: Composition gate (shipped pack catalog stays conflict-free)
        run: >
          node packages/cli/dist/bin.js analyze-composition
          --pack ./packages/pack-cli-agent/dist/index.js
          --pack ./packages/pack-access-governance/dist/index.js
          --pack ./packages/pack-incident-response/dist/index.js
          --pack ./packages/pack-payments-pix/dist/index.js
          --pack ./packages/pack-identity-kyc/dist/index.js
          --pack ./packages/pack-deployments-approval/dist/index.js

      # 084 — FROZEN adversarial-canary gate (alongside the ADR-140 composition
      # gate). Re-runs the full red-team suite + the 035 ownership/IDOR vector
      # over each shipped pack dist bundle as a DETERMINISTIC publish precondition.
      # `--canary-policy execute-escape` is the §D-1 PRIVILEGE-ESCALATION gate: a
      # rollback (exit 2) fires only when an adversarial intent reaches a clean
      # EXECUTE (the executor) or errors — fail-closed (§D-6). This is the right
      # policy for the HETEROGENEOUS shipped catalog: several packs legitimately
      # defend their adversarial scenarios UPSTREAM of the taint gate (schema/
      # state preconditions), and pack-identity-kyc carries the documented,
      # pre-existing 035-F1 #8 gap (forged-owner kinds resolve to DEFER friction,
      # not REFUSE — never an EXECUTE). The STRICT non-vacuity hard-fail (the full
      # gate) is exercised in the @adjudicate/red-team unit suite over a candidate
      # pack expected to FULLY defend; running it as a blocking gate over the
      # current catalog would over-block on those non-escalation properties (§7
      # risk). The gate runs entirely in the shell, never inside adjudicate()
      # (§D kernel purity). Fixed seed ⇒ reproducible verdict run-to-run.
      - name: Adversarial canary gate (frozen red-team over the shipped packs)
        run: |
          set -e
          for pack in \
            ./packages/pack-cli-agent/dist/index.js \
            ./packages/pack-access-governance/dist/index.js \
            ./packages/pack-incident-response/dist/index.js \
            ./packages/pack-payments-pix/dist/index.js \
            ./packages/pack-identity-kyc/dist/index.js \
            ./packages/pack-deployments-approval/dist/index.js ; do
            echo "::group::canary $pack"
            node packages/cli/dist/bin.js red-team --canary --canary-policy execute-escape --seed 1 --pack "$pack"
            echo "::endgroup::"
          done

      - name: Version consistency
        run: pnpm check:versions

      - name: Freeze-matrix consistency (advisory)
        run: pnpm check:freeze-matrix

      - name: Dependency advisory audit (high+)
        run: pnpm audit --prod --audit-level high
        continue-on-error: true

  # 083 — kernel-purity dep allowlist promoted to a REQUIRED CI gate.
  #
  # `pnpm rc:check` runs the release-candidate invariant chain whose
  # kernel-dep-allowlist step (scripts/rc-checks.ts) fails the build if
  # `@adjudicate/core` ever grows a dependency outside the §D allowlist
  # ({@adjudicate/canonical, @noble/hashes, zod}). Until now this lived only
  # in the `rc:check` script wired to NO workflow — the kernel-purity boundary
  # (§D) was enforced only if someone ran it locally. It is now a required
  # check on every PR + push-to-main.
  #
  # Kept as a SEPARATE job (083 §7 mitigation) so it can be reverted
  # independently of the lint+test job above. This is a build/CI gate only —
  # it NEVER runs inside `adjudicate()`. §C monotonicity / §D-6 fail-closed:
  # an unlisted kernel dependency reddens the pipeline and blocks the merge;
  # it never relaxes a gate.
  kernel-purity:
    name: Kernel-purity dep allowlist (rc:check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (workspace packages — needed by rc:check lint/test phases)
        run: pnpm build

      - name: RC invariant chain incl. kernel-dep allowlist
        run: pnpm rc:check
