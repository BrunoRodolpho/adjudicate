name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint + typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (workspace packages — types needed for typecheck/test)
        run: pnpm build

      - name: Lint (typecheck)
        run: pnpm lint

      - name: Test
        run: pnpm test

      # ADR-140: the shipped Pack catalog must stay free of cross-pack conflicts
      # (REWRITE-field overlap, DEFER-signal collision, taint contradiction,
      # duplicate intents). Offline/CI only — never runs inside adjudicate().
      # Adopters wire this same command over THEIR declared merge set.
      - name: Composition gate (shipped pack catalog stays conflict-free)
        run: >
          node packages/cli/dist/bin.js analyze-composition
          --pack ./packages/pack-cli-agent/dist/index.js
          --pack ./packages/pack-access-governance/dist/index.js
          --pack ./packages/pack-incident-response/dist/index.js
          --pack ./packages/pack-payments-pix/dist/index.js
          --pack ./packages/pack-identity-kyc/dist/index.js
          --pack ./packages/pack-deployments-approval/dist/index.js

      # 084 — adversarial-canary gate (alongside the ADR-140 composition gate).
      # Re-runs the FULL STRICT red-team suite + the 035 ownership/IDOR vector
      # over each shipped pack dist bundle and gates the verdict against a
      # COMMITTED, version-controlled BASELINE (.github/canary-baselines/<id>.json).
      #
      # The gate is the FULL STRICT gate (not the weaker `execute-escape` policy):
      # it sees every NON-EXECUTE escape and every §C friction regression, not
      # only a reached EXECUTE. The committed baseline freezes the DOCUMENTED,
      # pre-existing 035-F1 #8 gaps (pack-identity-kyc's forged-owner DEFER cases;
      # cli/pix/deploy's taint defended-upstream/vacuous cases) so CI does not go
      # permanently red on KNOWN holes — while ROLLING BACK (exit 2) the instant
      # any NEW escape/error/IDOR-escape/vacuity opens OR any baselined decision
      # weakens to LESS friction (e.g. a money-mover's IDOR REFUSE→DEFER). That is
      # the §C / §D-6 property the global `execute-escape` wiring could not deliver
      # (it promoted kyc's 12 open IDOR DEFERs and any non-EXECUTE friction-
      # lowering). A change to a pack's defended posture requires a REVIEWED
      # baseline update in the same PR. The gate runs entirely in the shell, never
      # inside adjudicate() (§D kernel purity). Fixed seed ⇒ reproducible verdict.
      - name: Adversarial canary gate (baseline-anchored strict red-team)
        run: |
          set -e
          for pack in \
            cli-agent:pack-cli-agent \
            access-governance:pack-access-governance \
            incident-response:pack-incident-response \
            payments-pix:pack-payments-pix \
            identity-kyc:pack-identity-kyc \
            deployments-approval:pack-deployments-approval ; do
            dir="${pack%%:*}" ; id="${pack##*:}"
            echo "::group::canary $id"
            node packages/cli/dist/bin.js red-team \
              --baseline ".github/canary-baselines/${id}.json" \
              --seed 1 \
              --pack "./packages/pack-${dir}/dist/index.js"
            echo "::endgroup::"
          done

      - name: Version consistency
        run: pnpm check:versions

      - name: Freeze-matrix consistency (advisory)
        run: pnpm check:freeze-matrix

      - name: Dependency advisory audit (high+)
        run: pnpm audit --prod --audit-level high
        continue-on-error: true

  # 083 — kernel-purity dep allowlist promoted to a REQUIRED CI gate.
  #
  # `pnpm rc:check` runs the release-candidate invariant chain whose
  # kernel-dep-allowlist step (scripts/rc-checks.ts) fails the build if
  # `@adjudicate/core` ever grows a dependency outside the §D allowlist
  # ({@adjudicate/canonical, @noble/hashes, zod}). Until now this lived only
  # in the `rc:check` script wired to NO workflow — the kernel-purity boundary
  # (§D) was enforced only if someone ran it locally. It is now a required
  # check on every PR + push-to-main.
  #
  # Kept as a SEPARATE job (083 §7 mitigation) so it can be reverted
  # independently of the lint+test job above. This is a build/CI gate only —
  # it NEVER runs inside `adjudicate()`. §C monotonicity / §D-6 fail-closed:
  # an unlisted kernel dependency reddens the pipeline and blocks the merge;
  # it never relaxes a gate.
  kernel-purity:
    name: Kernel-purity dep allowlist (rc:check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (workspace packages — needed by rc:check lint/test phases)
        run: pnpm build

      - name: RC invariant chain incl. kernel-dep allowlist
        run: pnpm rc:check
